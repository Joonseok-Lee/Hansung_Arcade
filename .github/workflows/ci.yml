name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 같은 PR(또는 브랜치)에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 오픈소스(MIT) 캐시. 기본값인 enhanced는 비공개 레포에서 무료 미리보기 상태라 basic으로 고정
          cache-provider: basic
          # 캐시 쓰기 규칙
          # - main, develop에 push된 빌드만 캐시를 저장한다. (기본값은 main만 저장)
          # - PR 빌드는 읽기만 한다. GitHub은 PR 실행이 대상(base) 브랜치의 캐시를 읽게 해 주므로
          #   develop으로 향하는 PR도 develop push 때 저장된 캐시를 그대로 쓴다.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
